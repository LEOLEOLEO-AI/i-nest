<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCC · iNEST Research Control Center</title>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--muted:#607080;--line:#dce3ea;--blue:#1769aa;--amber:#925d09}
    @media(prefers-color-scheme:dark){:root{--bg:#11171d;--card:#19232d;--ink:#e9eef3;--muted:#a7b4bf;--line:#2c3a45;--blue:#69b7ff;--amber:#f2b84b}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Microsoft YaHei",system-ui,sans-serif}header{background:var(--card);border-bottom:1px solid var(--line);padding:18px max(20px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;gap:16px}h1{margin:0;font-size:22px}h1 span,a{color:var(--blue)}.meta,.label{color:var(--muted);font-size:12px}main{max-width:1180px;margin:0 auto;padding:24px 20px 52px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card,.panel,.track{background:var(--card);border:1px solid var(--line);border-radius:7px}.card{padding:15px;min-height:96px}.value{margin-top:7px;font-size:25px;font-weight:700}.panel{margin-top:18px;padding:18px}h2{font-size:16px;margin:0 0 12px;padding-left:9px;border-left:4px solid var(--blue)}table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-size:12px}.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;background:#e7effb;color:#145286}.pending{background:#fff1d6;color:var(--amber)}.tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px}.track{padding:14px}.track h3{margin:0 0 7px;font-size:15px}ul{margin:7px 0 0;padding-left:18px}.notice{border-left:3px solid var(--amber);padding:9px 12px;background:#fff7e6}.empty{color:var(--muted);padding:10px 0}@media(max-width:720px){header{display:block}.meta{margin-top:5px}.tracks{grid-template-columns:1fr}th:nth-child(3),td:nth-child(3){display:none}}
  </style>
</head>
<body>
  <header><div><h1><span>TCC</span> · <span>iNEST</span> Research Control Center</h1><div class="label">Evidence-driven knowledge compilation, task approval, and research execution</div></div><div class="meta" id="meta">Loading</div></header>
  <main id="app"></main>
  <script src="data.js"></script>
  <script>
    var D=window.RESEARCH_DASHBOARD||{};
    function e(v){return String(v==null?'':v).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
    function open(path,label){return '<a target="_blank" href="http://127.0.0.1:8899/vault/'+encodeURI(path)+'">'+e(label)+'</a>'}
    function card(k,v){return '<div class="card"><div class="label">'+e(k)+'</div><div class="value">'+e(v)+'</div></div>'}
    function render(){
      var s=D.state||{},r=D.knowledge_review||{pending:0,items:[]},tasks=(D.plan||[]).slice(0,8),p=D.progress&&D.progress[0]||{};
      document.getElementById('meta').textContent='Updated: '+(D.generated_at||'-')+' | Preview: '+(s.services&&s.services.preview_server_8899?'ready':'check')+' | Pending tasks: '+(D.task_review&&D.task_review.pending_review||0);
      var h='<div class="grid">'+card('Knowledge notes',s.total_notes||'-')+card('TCC',s.tcc_notes||'-')+card('iNEST',s.inest_notes||'-')+card('Processing',s.processing||'-')+card('Outputs',s.outputs||'-')+card('Evidence review',r.pending||0)+'</div>';
      h+='<section class="panel"><h2>Research Tracks</h2><div class="tracks"><div class="track"><h3>TCC · Topological Center Computing</h3><ul><li>Theory: R / T / C primitives and verifiable baseline</li><li>Technology: SDI, Chiplet, OneFabric, wafer-scale interconnect</li><li>Engineering: RTL, CST, FPGA, simulation</li></ul></div><div class="track"><h3>iNEST · Emergent Intelligence</h3><ul><li>Theory: complex networks, criticality, emergence</li><li>Technology: SNN, devices, learning rules</li><li>Engineering: models, simulation, HW/SW co-design</li></ul></div></div></section>';
      h+='<section class="panel"><h2>External Evidence Awaiting Review</h2><div class="notice">External papers and clippings are candidate evidence only. They do not count as team papers, patents, engineering IP, or project outcomes until you confirm them.</div>';
      if(r.items&&r.items.length){h+='<table><tr><th>Candidate insight</th><th>Track</th><th>Evidence</th><th>Next action</th></tr>';r.items.forEach(function(x){h+='<tr><td>'+open(x.file,x.title)+'</td><td><span class="tag pending">'+e(x.track)+'</span></td><td>'+e(x.evidence_status)+'</td><td>'+e(x.action)+'</td></tr>'});h+='</table>'}else{h+='<p class="empty">No high-value evidence awaiting review.</p>'}h+='<p class="label">'+open(r.review_note||'60_MOC/12_Knowledge_Review_'+D.date+'.md','Open daily knowledge review')+'</p></section>';
      h+='<section class="panel"><h2>Active Work</h2>';if(tasks.length){h+='<table><tr><th>Track</th><th>Task</th><th>Status</th><th>Source</th></tr>';tasks.forEach(function(t){h+='<tr><td><span class="tag">'+e(t.track)+'</span></td><td>'+e(t.text)+'</td><td>'+e(t.status)+'</td><td>'+e(t.source)+'</td></tr>'});h+='</table>'}else{h+='<p class="empty">No active tasks.</p>'}h+='</section>';
      h+='<section class="panel"><h2>Pipeline</h2><p>Today: '+e(p.papers||0)+' papers; graph: '+e(p.nodes||0)+' nodes / '+e(p.edges||0)+' edges.</p><p class="label">Every metric requires [measured], [simulated], [cited], [derived], or [to-test] evidence status. Unconfirmed candidates never enter formal plans.</p></section>';
      document.getElementById('app').innerHTML=h;
    }render();
  </script>
</body>
</html>
