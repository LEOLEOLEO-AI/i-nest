# research_evolve 阈值配置
# 所有阈值都是显式可审计的；不在此文件中放任何"经验估算"的性能数字。
version: "1.0.0"
effective_date: "2026-09-18"

# 每次呈交给用户裁决的条数上限（避免一次抛 18 条让人无从下手）
max_human_decisions: 7

# open 候选挂起多久后升级为"需拍板"
max_open_days: 14

# 反复出现却始终不可执行多少次后自动 deferred
defer_min_seen: 3

# 冻结守卫：无新来源材料时冻结"新增概念"（08-27 诊断已提，此前未落地）
freeze_requires_new_source: true
freeze_window_days: 2

# 门禁扫描范围（只扫交付草稿，不扫全库，控制耗时）
gate_paths:
  - "50_Output/51_Papers"
  - "50_Output/52_Patents"
  - "50_Output/53_Monographs"
gate_scan_limit: 400

# 分数达此门槛时仅"建议采纳"，仍留给人拍板（自动永不采纳）
min_accept_score: 0.55

# 评分权重（合计 1.0）
weights:
  framework_fit: 0.34     # 是否落在 TCC / iNEST 词表内
  testability: 0.28       # 是否有可执行的验证方法与判据
  evidence_ready: 0.22    # 是否有来源/证据字段
  bridge_value: 0.16      # 跨域桥强度（已对字母序伪相关降权）
